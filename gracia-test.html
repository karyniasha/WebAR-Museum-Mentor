<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracia Three.js Test</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101010;
      }

      #viewer {
        width: 100%;
        height: 100%;
      }

      #viewer canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 8px 10px;
        color: #ffffff;
        background: rgb(0 0 0 / 65%);
        border-radius: 4px;
        font: 14px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="viewer" aria-label="Gracia Three.js viewer"></main>
    <p id="status" role="status" aria-live="polite">Checking WebGPU…</p>
    <script type="module" src="/src/gracia-test.js"></script>
  </body>
</html>
